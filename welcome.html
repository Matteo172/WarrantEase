<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>WarrantEase</title>
        <link rel="stylesheet" href="style.css"/>
        <link rel="icon" href="./photos/logo.png"

    </head>
    <body>
        <div class="opacity-effect">

            <nav>

                <div id="nav-container">
                    <a href="welcome.html"><img id="logo" src="./photos/logo.png"/></a>
                    <a class="underline-logo-name" href="welcome.html"><h1 id="brand-name">WarrantEase</h1></a>

                    <div class="button-container">
                        <button id="Home" type="submit" onclick="window.location.href='welcome.html'" >Home</button>
                        <button id="Service" type="submit" onclick="window.location.href='welcome.html'" >Service</button>
                        <button id="Contact" type="submit" onclick="window.location.href='welcome.html'" >Contact</button>
                        <button id="About" type="submit" onclick="window.location.href='welcome.html'" >About</button>
                        <button id="Signin" type="submit" onclick="window.location.href='welcome.html'" >Sign in</button>
                    </div>
                </div>

            </nav>


            <main>

                <h2 id="signin-word">Sign in</h2>
                <p id="enjoy">Enjoy new experience</p>

                <div class="login-container">
                    <label id="emailAddressWord">Email Address</label>
                    <input type="email" id="emailAddress" name="email" placeholder="johndoe@example.com" required>
                    
                    <label id="passwordWord">Password</label>
                    <input type="password" id="password" name="email" placeholder="" required>
                </div>


            </main>

        </div>
        
    </body>
</html>
