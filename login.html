<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="login.css"/>
        <link rel="icon" href="./photos/logo.png">

        <title>WarrantEase | Login</title>

    </head>


    <body>

        <main>

            <div id="login-container"> 

                <div id="logo-header">
                    <img id="logo" src="./photos/logo.png"> 
                    <span id="brand-name">WarrantEase</span>
                </div>

                <span id="login-word">Login</span>

                <label id="emailAddressWord">Email</label> 
                <input type="email" id="emailAddress" name="email" placeholder="johndoe@example.com" required> 

                <label id="passwordWord">Password</label> 
                <input type="password" id="Password" name="password" placeholder="Enter your password" required> 

                <button id="forgot-password" type="submit">Forgot password?</button>

                <div id="continue-container">
                    <hr class="line1"><span id="continue">or continue with</span><hr class="line2">
                </div>

                <div id="continue-with-accounts">
                    <button id="google" type="submit"><img id="google-logo" src="./photos/Google_Favicon_2025.svg.webp"></button>
                    <button id="apple" type="submit"><img id="apple-logo" src="./photos/apple-logo4.png"></button>
                </div>

                <div id="signup-container">

                    <span id="Signup1">Don't have an account?</span>
                    <span id="Signup2">Sign up</span>

                </div>



            </div>

            <div id="design-container"></div>


        </main>

        







        
    </body>

</html>
